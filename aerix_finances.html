<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviso de Privacidad — Aerix Finances</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome 6 (Iconos) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Font: Inter (Tipografía Limpia & Editorial) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    
    /* Patron SVG Minimalista tipo Grid / Dot Matrix de Alta Calidad */
    .bg-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="h-full flex flex-col antialiased bg-slate-950 text-slate-100 bg-pattern selection:bg-indigo-500 selection:text-white">

  <!-- Glows / Resplandores SVG de fondo estilo UI Premium -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Header minimalista -->
  <header class="relative z-10 w-full max-w-6xl mx-auto px-6 pt-6 pb-4 flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-white/10">
    <!-- Branding -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 ring-1 ring-white/20">
        <i class="fa-solid fa-shield-halved text-lg"></i>
      </div>
      <div>
        <h1 class="text-base font-semibold tracking-wide text-white">Aerix Finances</h1>
        <p class="text-xs text-slate-400 font-light">Legal & Compliance</p>
      </div>
    </div>

    <!-- Etiqueta de Documento -->
    <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-md">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-xs font-medium text-slate-300">Aviso de Privacidad</span>
      <span class="text-[10px] text-slate-500 font-mono pl-1 border-l border-white/10">v2026.08</span>
    </div>
  </header>

  <!-- Contenedor Principal / Visor PDF -->
  <main class="relative z-10 flex-1 w-full max-w-6xl mx-auto p-4 sm:p-6 flex flex-col">
    <div class="flex-1 w-full flex flex-col rounded-2xl bg-slate-900/60 backdrop-blur-xl border border-white/10 shadow-2xl overflow-hidden ring-1 ring-black/50">
      
      <!-- Toolbar del PDF -->
      <div class="px-5 py-3 bg-slate-900/80 border-b border-white/5 flex items-center justify-between text-xs text-slate-400">
        <div class="flex items-center gap-2">
          <i class="fa-regular fa-file-pdf text-red-400 text-sm"></i>
          <span class="font-mono truncate max-w-[200px] sm:max-w-none text-slate-300">Aviso_de_Privacidad_Aerix_Finances_20260815.pdf</span>
        </div>
        
        <!-- Acciones directas -->
        <a href="Aviso_de_Privacidad_Aerix_Finances_20260815.pdf" target="_blank" download
           class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-indigo-600/80 hover:bg-indigo-500 text-white font-medium transition-all duration-200 shadow-md shadow-indigo-600/20 border border-indigo-400/30">
          <i class="fa-solid fa-download text-xs"></i>
          <span>Descargar</span>
        </a>
      </div>

      <!-- Iframe Frame -->
      <div class="relative flex-1 w-full bg-slate-950/50">
        <iframe 
          src="Aviso_de_Privacidad_Aerix_Finances_20260815.pdf#toolbar=1" 
          class="w-full h-full min-h-[500px] border-0"
          title="Aviso de Privacidad Aerix Finances">
        </iframe>
      </div>

    </div>
  </main>

  <!-- Footer con estilo corporativo -->
  <footer class="relative z-10 w-full max-w-6xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
    <p>© 2026 Aerix Finances. Todos los derechos reservados.</p>
    <div class="flex items-center gap-4">
      <span class="hover:text-slate-400 transition-colors">Seguridad de Datos</span>
      <span>•</span>
      <span class="hover:text-slate-400 transition-colors">Términos de Servicio</span>
    </div>
  </footer>

</body>
</html>
